name: Sync master to wp-spectra

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sync:
    name: Sync to wp-spectra mirror
    runs-on: ubuntu-latest
    steps:
      - name: Sync via GitHub API
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.WP_SPECTRA_SYNC_TOKEN }}
          script: |
            // Get UAGB master commit + tree
            const uagbRef = await github.rest.git.getRef({
              owner: 'brainstormforce',
              repo: 'ultimate-addons-for-gutenberg',
              ref: 'heads/master',
            });
            const uagbSha = uagbRef.data.object.sha;

            const uagbCommit = await github.rest.git.getCommit({
              owner: 'brainstormforce',
              repo: 'ultimate-addons-for-gutenberg',
              commit_sha: uagbSha,
            });
            const treeSha = uagbCommit.data.tree.sha;

            // Get current wp-spectra master SHA as parent
            const mirrorRef = await github.rest.git.getRef({
              owner: 'brainstormforce',
              repo: 'wp-spectra',
              ref: 'heads/master',
            });
            const parentSha = mirrorRef.data.object.sha;

            // Skip if already in sync
            if (parentSha === uagbSha) {
              core.info('wp-spectra is already in sync. Nothing to do.');
              return;
            }

            // Create a new verified commit on wp-spectra via the API
            const newCommit = await github.rest.git.createCommit({
              owner: 'brainstormforce',
              repo: 'wp-spectra',
              message: `chore: sync from ultimate-addons-for-gutenberg @ ${uagbSha.slice(0, 7)}`,
              tree: treeSha,
              parents: [parentSha],
            });

            // Update master to point to the new commit
            await github.rest.git.updateRef({
              owner: 'brainstormforce',
              repo: 'wp-spectra',
              ref: 'heads/master',
              sha: newCommit.data.sha,
            });

            core.info(`Synced wp-spectra master to ${newCommit.data.sha.slice(0, 7)}`);
